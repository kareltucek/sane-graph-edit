<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sane Graph Edit</title>
  <link rel="stylesheet" href="xterm.css">
  <style>
    /* --fg, --bg and --canvas are set by the page's script: the colours of the graph */
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas, #eee); }
    body { display: flex; flex-direction: column; font: 12px monospace; color: var(--fg, #000); }
    /* two canvases in one place: the graph drawn with depth below (3D mode only), and above it the flat one, which also takes the pointer */
    #stage { position: relative; flex: 1; min-height: 0; }
    canvas { position: absolute; left: 0; top: 0; display: block; width: 100%; height: 100%; }
    #space { display: none; pointer-events: none; }
    #tabs { display: flex; overflow: hidden; background: var(--canvas, #eee); border-bottom: 1px solid var(--fg, #000); user-select: none; }
    .tab { padding: 3px 12px; white-space: nowrap; border-right: 1px solid var(--fg, #000); cursor: pointer; opacity: 0.7; }
    .tab.current { background: var(--bg, #fff); opacity: 1; }
    #bottom { position: relative; }
    #status { padding: 2px 6px; white-space: pre; overflow: hidden; background: var(--bg, #fff); border-top: 1px solid var(--fg, #000); }
    #editor-status { display: none; padding: 2px 6px; white-space: pre; overflow: hidden; background: var(--bg, #fff); border-top: 1px solid var(--fg, #000); }
    /* While a node is edited, neovim's two lines are shown and the page's status line is not: neovim's own line in its place, */
    /* its status line above that, over the bottom of the graph, so that the graph does not move when they come and go. */
    /* No line between the two: the border of the lower one is in the background's colour unless it is alone. */
    #editor-line {
      position: absolute; left: 0; right: 0; top: 0; bottom: 0; box-sizing: border-box; display: none; padding: 2px 6px; white-space: pre; overflow: hidden;
      background: var(--bg, #fff); border-top: 1px solid var(--bg, #fff);
    }
    #editor-line.alone { border-top-color: var(--fg, #000); }
    #editor-lines { position: absolute; left: 0; right: 0; bottom: 100%; }
    /* whose lines these are: the graph's or neovim's */
    #which { position: absolute; left: 50%; top: 1px; transform: translateX(-50%); padding: 2px 6px; opacity: 0.5; pointer-events: none; }
    #line {
      position: absolute; left: 0; right: 0; bottom: 0; top: 0; box-sizing: border-box; width: 100%; padding: 2px 6px; display: none;
      font: inherit; color: inherit; background: var(--bg, #fff); border: none; border-top: 1px solid var(--fg, #000); outline: none;
    }
    #pane {
      position: absolute; left: 0; right: 0; bottom: 100%; max-height: 40vh; overflow: auto; margin: 0; padding: 4px 6px; display: none;
      font: inherit; white-space: pre; background: var(--bg, #fff); border-top: 1px solid var(--fg, #000);
    }
    #picker {
      position: fixed; display: none; flex-direction: column; box-sizing: border-box; width: 500px; height: 300px;
      background: var(--bg, #fff); border: 1px solid var(--fg, #000);
    }
    #picker button { font: inherit; border: 1px solid var(--canvas, #ccc); margin: 0; padding: 0; cursor: pointer; }
    #picker-colours { flex: 1; display: grid; }
    #picker-rest { display: flex; align-items: center; gap: 6px; padding: 4px 6px; }
    #picker-rest button { min-width: 3em; height: 2em; color: var(--fg, #000); background: var(--canvas, #ddd); }
    #message { position: fixed; left: 0; right: 0; bottom: 0; padding: 4px 8px; background: #eee; color: #000; display: none; }
  </style>
</head>
<body>
  <div id="tabs"></div>
  <div id="stage">
    <canvas id="space"></canvas>
    <canvas id="graph"></canvas>
  </div>
  <div id="bottom">
    <div id="editor-lines">
      <div id="editor-status"></div>
    </div>
    <pre id="pane"></pre>
    <div id="status">&nbsp;</div>
    <div id="editor-line"></div>
    <div id="which">graph</div>
    <input id="line" spellcheck="false" autocomplete="off">
  </div>
  <div id="picker">
    <div id="picker-colours"></div>
    <div id="picker-rest">
      <span>Size:</span><button data-size="-1">-</button><button data-size="1">+</button>
      <span>Shape:</span><button data-shape="box">⬜</button><button data-shape="oval">⚪</button>
    </div>
  </div>
  <div id="message"></div>
  <script src="renderer.js"></script>
</body>
</html>
