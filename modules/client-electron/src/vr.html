<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sane Graph Edit: VR</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #222; color: #ddd; font: 16px sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #bar { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 12px; align-items: center; padding: 10px 14px; background: rgba(0, 0, 0, 0.6); }
    button { font: inherit; padding: 10px 18px; border: 1px solid #888; border-radius: 6px; background: #333; color: #eee; }
    button:disabled { opacity: 0.4; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="enter-ar" disabled>Enter, room visible</button>
    <button id="enter-vr" disabled>Enter, room hidden</button>
    <span id="state">connecting…</span>
  </div>
  <canvas id="view"></canvas>
  <script src="vr.js"></script>
</body>
</html>
